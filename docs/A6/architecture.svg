<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="1060" height="600" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">
  <title>Support request router: user, application, decision capability, downstream action</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a4b00"/>
    </marker>
  </defs>

  <!-- lane titles and separators -->
  <g font-size="14" font-weight="700" fill="#222">
    <text x="90" y="28" text-anchor="middle">1. User</text>
    <text x="330" y="28" text-anchor="middle">2. Application</text>
    <text x="650" y="28" text-anchor="middle">3. Decision capability</text>
    <text x="940" y="28" text-anchor="middle">4. Downstream action</text>
  </g>
  <g stroke="#bbb" stroke-dasharray="4 4">
    <line x1="190" y1="40" x2="190" y2="605"/>
    <line x1="470" y1="40" x2="470" y2="605"/>
    <line x1="830" y1="40" x2="830" y2="605"/>
  </g>

  <!-- 1. user -->
  <text x="95" y="120" text-anchor="middle" font-size="12" fill="#333">POST /api/support/tickets</text>
  <text x="95" y="136" text-anchor="middle" font-size="12" fill="#333">{ message, context? }</text>
  <rect x="20" y="150" width="140" height="90" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="90" y="178" text-anchor="middle" font-weight="600">Student or staff</text>
  <text x="90" y="198" text-anchor="middle">writes a free-text</text>
  <text x="90" y="216" text-anchor="middle">support message</text>
  <text x="90" y="234" text-anchor="middle" fill="#555" font-size="12">(web form, chat, email)</text>
  <line x1="160" y1="195" x2="212" y2="195" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- response back to the user -->
  <path d="M 212 512 L 90 512 L 90 242" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="528" text-anchor="middle" font-size="12" fill="#333">response</text>

  <!-- 2. application -->
  <rect x="212" y="70" width="240" height="460" rx="12" fill="#f6f8fa" stroke="#555" stroke-width="1.5"/>
  <text x="332" y="95" text-anchor="middle" font-weight="600">Campus Equipment Booking API</text>
  <text x="332" y="113" text-anchor="middle" font-size="12" fill="#555">Hono on Cloudflare Workers (src/index.ts)</text>

  <rect x="228" y="130" width="208" height="86" rx="8" fill="#fff" stroke="#777"/>
  <text x="332" y="151" text-anchor="middle" font-weight="600">a. Validate the input</text>
  <text x="332" y="169" text-anchor="middle" font-size="12">message 1 to 2000 chars, no control chars</text>
  <text x="332" y="185" text-anchor="middle" font-size="12">ids ≤ 64 chars; equipment exists</text>
  <text x="332" y="201" text-anchor="middle" font-size="12">otherwise 413, 400 or 404</text>
  <line x1="332" y1="216" x2="332" y2="234" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="228" y="236" width="208" height="132" rx="8" fill="#fff" stroke="#777"/>
  <text x="332" y="257" text-anchor="middle" font-weight="600">b. routeSupportRequest()</text>
  <text x="332" y="275" text-anchor="middle" font-size="12" fill="#555">src/support-router.ts</text>
  <text x="332" y="295" text-anchor="middle" font-size="12">builds the state + 3 typed questions,</text>
  <text x="332" y="311" text-anchor="middle" font-size="12">calls the model with an 8 s limit,</text>
  <text x="332" y="327" text-anchor="middle" font-size="12">validates the answer and applies</text>
  <text x="332" y="343" text-anchor="middle" font-size="12">the policy, or lets the fallback</text>
  <text x="332" y="359" text-anchor="middle" font-size="12">decide instead</text>
  <line x1="332" y1="368" x2="332" y2="386" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="228" y="388" width="208" height="84" rx="8" fill="#fff" stroke="#777"/>
  <text x="332" y="409" text-anchor="middle" font-weight="600">c. Act on the decision</text>
  <text x="332" y="427" text-anchor="middle" font-size="12">INSERT INTO support_tickets</text>
  <text x="332" y="443" text-anchor="middle" font-size="12">(parameter binding): queue, urgency,</text>
  <text x="332" y="459" text-anchor="middle" font-size="12">needs_human, source, decision JSON</text>

  <text x="332" y="494" text-anchor="middle" font-size="12" fill="#333">201 Created: ticket + decision</text>
  <text x="332" y="510" text-anchor="middle" font-size="12" fill="#333">(a model failure is never an error status)</text>

  <!-- application <-> model -->
  <line x1="436" y1="282" x2="490" y2="178" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="240" x2="436" y2="304" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- application -> fallback -->
  <line x1="436" y1="346" x2="490" y2="372" stroke="#8a4b00" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-dashed)"/>
  <text x="471" y="390" text-anchor="middle" font-size="11" fill="#8a4b00">on</text>
  <text x="471" y="403" text-anchor="middle" font-size="11" fill="#8a4b00">failure</text>

  <!-- 3. decision capability: the model -->
  <rect x="492" y="70" width="320" height="220" rx="12" fill="#eefaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="652" y="95" text-anchor="middle" font-weight="600">Decision model: Cloudflare Workers AI</text>
  <text x="652" y="113" text-anchor="middle" font-size="12" fill="#333">@cf/cloudflare/clef (same question types as Jev)</text>

  <rect x="508" y="128" width="288" height="74" rx="8" fill="#fff" stroke="#2e7d32"/>
  <text x="652" y="147" text-anchor="middle" font-weight="600" font-size="12">In: env.AI.run(state + typed questions)</text>
  <text x="652" y="165" text-anchor="middle" font-size="12">queue: choice of 4 labels</text>
  <text x="652" y="181" text-anchor="middle" font-size="12">urgency: score, 3 ordered levels</text>
  <text x="652" y="197" text-anchor="middle" font-size="12">needs_human: noul (yes/no probability)</text>

  <rect x="508" y="210" width="288" height="72" rx="8" fill="#fff" stroke="#2e7d32"/>
  <text x="652" y="229" text-anchor="middle" font-weight="600" font-size="12">Out: answers with probabilities, no prose</text>
  <text x="652" y="247" text-anchor="middle" font-size="12">choice + probability per label + confidence,</text>
  <text x="652" y="263" text-anchor="middle" font-size="12">weighted score + probability per level,</text>
  <text x="652" y="279" text-anchor="middle" font-size="12">probability of "yes"; ~520 input tokens, under 2 s</text>

  <!-- 3. decision capability: the fallback -->
  <rect x="492" y="300" width="320" height="146" rx="12" fill="#fff6e8" stroke="#b86e00" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="652" y="325" text-anchor="middle" font-weight="600">Deterministic fallback (inside the Worker)</text>
  <text x="652" y="345" text-anchor="middle" font-size="12">used when: no AI binding · model error · no answer</text>
  <text x="652" y="361" text-anchor="middle" font-size="12">within 8 s · answer fails the schema check</text>
  <text x="652" y="383" text-anchor="middle" font-size="12">keyword rules pick the queue and urgency;</text>
  <text x="652" y="399" text-anchor="middle" font-size="12">needsHuman is always true, confidence 0;</text>
  <text x="652" y="415" text-anchor="middle" font-size="12">source = "fallback" + fallbackReason</text>
  <text x="652" y="437" text-anchor="middle" font-size="12" fill="#8a4b00">rules alone matched 9 of 13 test inputs, the model 13 of 13</text>

  <!-- policy -->
  <rect x="492" y="456" width="320" height="60" rx="8" fill="#fff" stroke="#999"/>
  <text x="652" y="476" text-anchor="middle" font-weight="600" font-size="12">Policy on a valid model answer</text>
  <text x="652" y="493" text-anchor="middle" font-size="12">queue = choice · urgency = most probable level</text>
  <text x="652" y="509" text-anchor="middle" font-size="12">needsHuman = P(yes) ≥ 0.5 or confidence &lt; 0.6</text>

  <!-- 4. downstream -->
  <rect x="852" y="150" width="190" height="110" rx="10" fill="#f3eefb" stroke="#6a4c93" stroke-width="1.5"/>
  <text x="947" y="175" text-anchor="middle" font-weight="600">Staff queue view</text>
  <text x="947" y="195" text-anchor="middle" font-size="12">GET /api/support/tickets</text>
  <text x="947" y="211" text-anchor="middle" font-size="12">?queue=equipment_fault</text>
  <text x="947" y="231" text-anchor="middle" font-size="12">newest first; tickets with</text>
  <text x="947" y="247" text-anchor="middle" font-size="12">needsHuman flagged for a person</text>

  <rect x="852" y="500" width="190" height="96" rx="10" fill="#f3eefb" stroke="#6a4c93" stroke-width="1.5"/>
  <text x="947" y="524" text-anchor="middle" font-weight="600">D1: support_tickets</text>
  <text x="947" y="544" text-anchor="middle" font-size="12">one row per message with the</text>
  <text x="947" y="560" text-anchor="middle" font-size="12">queue, urgency, needs_human,</text>
  <text x="947" y="576" text-anchor="middle" font-size="12">source and the full decision JSON</text>

  <!-- store the ticket (corridor below the decision lane), then staff read the queue -->
  <path d="M 400 530 L 400 548 L 850 548" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="542" text-anchor="middle" font-size="12" fill="#333">store the ticket with its decision</text>
  <line x1="947" y1="500" x2="947" y2="262" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="960" y="385" text-anchor="start" font-size="12" fill="#333">staff read</text>
  <text x="960" y="401" text-anchor="start" font-size="12" fill="#333">one queue</text>
</svg>
