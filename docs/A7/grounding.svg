<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">
  <title>A7: how the retrieved guidelines reach the model, and how the evaluation runs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b35c00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#222">The one improvement: retrieved support guidelines are added to the state (ROUTER_GROUNDING=on)</text>

  <!-- message -->
  <rect x="20" y="60" width="170" height="92" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="105" y="86" text-anchor="middle" font-weight="600">Support message</text>
  <text x="105" y="106" text-anchor="middle" font-size="12">message text and the</text>
  <text x="105" y="122" text-anchor="middle" font-size="12">optional equipment id</text>
  <text x="105" y="140" text-anchor="middle" font-size="11" fill="#555">POST /api/support/route</text>

  <!-- retrieval -->
  <rect x="230" y="48" width="330" height="190" rx="10" fill="#fff6e8" stroke="#b86e00" stroke-width="1.5"/>
  <text x="395" y="72" text-anchor="middle" font-weight="600">selectGuidelines() (src/grounding.ts) — new in A7</text>
  <text x="395" y="92" text-anchor="middle" font-size="12">knowledge base: src/knowledge-base.json, 10 records</text>
  <text x="246" y="118" font-size="12">1. always: KB05 urgency levels,</text>
  <text x="262" y="134" font-size="12">KB07 when a person must read</text>
  <text x="246" y="156" font-size="12">2. score every other record: how many of its</text>
  <text x="262" y="172" font-size="12">keywords (English and Thai) occur in the message</text>
  <text x="246" y="194" font-size="12">3. add the 3 best (score ≥ 1; a tie goes to the</text>
  <text x="262" y="210" font-size="12">record listed first); no vector database</text>
  <text x="395" y="230" text-anchor="middle" font-size="11" fill="#8a4b00">same keyword matching as the fallback</text>

  <!-- request -->
  <rect x="600" y="48" width="200" height="190" rx="10" fill="#f6f8fa" stroke="#555" stroke-width="1.5"/>
  <text x="700" y="72" text-anchor="middle" font-weight="600">Request to the model</text>
  <text x="616" y="98" font-size="12">model: "clef"</text>
  <text x="616" y="118" font-size="12">state: service, message,</text>
  <text x="630" y="134" font-size="12">equipmentId (as in A6)</text>
  <text x="630" y="152" font-size="12" fill="#b35c00" font-weight="600">+ guidelines: [ {id,</text>
  <text x="644" y="168" font-size="12" fill="#b35c00" font-weight="600">title, text}, … ]</text>
  <text x="616" y="192" font-size="12">questions: queue, urgency,</text>
  <text x="630" y="208" font-size="12">needs_human (unchanged)</text>

  <!-- model -->
  <rect x="840" y="48" width="200" height="190" rx="10" fill="#eefaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="940" y="72" text-anchor="middle" font-weight="600">@cf/cloudflare/clef</text>
  <text x="940" y="92" text-anchor="middle" font-size="12">(Workers AI, unchanged)</text>
  <text x="940" y="124" text-anchor="middle" font-size="12">answers with probabilities;</text>
  <text x="940" y="142" text-anchor="middle" font-size="12">validation, policy (0.5 / 0.6)</text>
  <text x="940" y="160" text-anchor="middle" font-size="12">and fallback as in A6</text>
  <text x="940" y="190" text-anchor="middle" font-size="12">decision + details.</text>
  <text x="940" y="206" text-anchor="middle" font-size="12">contextRecords (ids sent)</text>

  <!-- arrows top -->
  <line x1="190" y1="106" x2="228" y2="106" stroke="#b35c00" stroke-width="1.6" marker-end="url(#arrow-new)"/>
  <line x1="560" y1="150" x2="598" y2="150" stroke="#b35c00" stroke-width="1.6" marker-end="url(#arrow-new)"/>
  <line x1="800" y1="143" x2="838" y2="143" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- baseline bypass -->
  <path d="M 105 152 L 105 262 L 700 262 L 700 240" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="400" y="280" text-anchor="middle" font-size="12" fill="#444">Baseline (ROUTER_GROUNDING=off, the default): no retrieval, the request is exactly the A6 request</text>

  <!-- evaluation -->
  <text x="20" y="330" font-size="15" font-weight="700" fill="#222">The evaluation: the same 10 cases, 5 times each, against both variants</text>

  <rect x="20" y="352" width="200" height="110" rx="10" fill="#f3eefb" stroke="#6a4c93" stroke-width="1.5"/>
  <text x="120" y="376" text-anchor="middle" font-weight="600">eval/eval-cases.json</text>
  <text x="120" y="396" text-anchor="middle" font-size="12">3 normal, 3 edge, 2 fallback,</text>
  <text x="120" y="412" text-anchor="middle" font-size="12">2 difficult; expectations from</text>
  <text x="120" y="428" text-anchor="middle" font-size="12">the knowledge base, frozen</text>
  <text x="120" y="444" text-anchor="middle" font-size="12">(SHA-256) before any run</text>

  <rect x="260" y="352" width="290" height="110" rx="10" fill="#f6f8fa" stroke="#555" stroke-width="1.5"/>
  <text x="405" y="376" text-anchor="middle" font-weight="600">npm run eval -- --variant …</text>
  <text x="405" y="396" text-anchor="middle" font-size="12">real curl requests, timed by curl;</text>
  <text x="405" y="412" text-anchor="middle" font-size="12">model cases → server :8787, T07 → :8789</text>
  <text x="405" y="428" text-anchor="middle" font-size="12">(model fails), T08 → :8790 (1 ms limit)</text>
  <text x="405" y="444" text-anchor="middle" font-size="12">refuses to run on the wrong variant</text>

  <rect x="590" y="352" width="200" height="110" rx="10" fill="#f6f8fa" stroke="#555" stroke-width="1.5"/>
  <text x="690" y="376" text-anchor="middle" font-weight="600">eval/results/*.json</text>
  <text x="690" y="396" text-anchor="middle" font-size="12">every decision, response</text>
  <text x="690" y="412" text-anchor="middle" font-size="12">time and token count;</text>
  <text x="690" y="428" text-anchor="middle" font-size="12">execution logs</text>
  <text x="690" y="444" text-anchor="middle" font-size="12">eval/*_EVIDENCE.md</text>

  <rect x="830" y="352" width="210" height="110" rx="10" fill="#eefaf0" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="935" y="376" text-anchor="middle" font-weight="600">npm run eval:compare</text>
  <text x="935" y="396" text-anchor="middle" font-size="12">accuracy, p95 latency,</text>
  <text x="935" y="412" text-anchor="middle" font-size="12">tokens and estimated cost,</text>
  <text x="935" y="428" text-anchor="middle" font-size="12">before and after, per case</text>
  <text x="935" y="444" text-anchor="middle" font-size="12">→ eval/COMPARISON.md</text>

  <line x1="220" y1="407" x2="258" y2="407" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="407" x2="588" y2="407" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="790" y1="407" x2="828" y2="407" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="500" font-size="12" fill="#444">Only one thing differs between the two runs: ROUTER_GROUNDING. The model, the questions, the thresholds, the fallback and the</text>
  <text x="20" y="518" font-size="12" fill="#444">10 cases are the same; a unit check proves that with grounding off the request is byte-identical to the request of A6.</text>
</svg>
